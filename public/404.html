<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      // SPA redirect for GitHub Pages
      // Stores the full path in sessionStorage and redirects to the app root
      var path = window.location.pathname;
      var base = '/homebynox';
      sessionStorage.setItem('spa_redirect', path.replace(base, '') || '/');
      window.location.replace(base + '/');
    </script>
  </head>
  <body></body>
</html>
